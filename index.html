<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/styles.css"
</head>
<body>
    <main>
        <section>
            <form action="">
                <h3>Primer ejercicio DOM</h3>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Ingresar Nombre">

                <br>
                <input type="text" id="resultado">
                <button type= "button" onclick="saludar()">Aceptar</button>
                <button type="reset">Cancelar</button>
        </section>  
            </form>

            <section>
                <h3>Segundo ejercicio DOM</h3>

                <form action="">
                    <label for="nombre2">Nombre completo:</label>
                    <input type="text" id="nombre2">
                    <label for="programa2">Programa de formación:</label>
                    <input type="text" id="programa2">
                    <button onclick="registrar()" type="button">Registrar</button>
                </form>
                <h2>Resultados</h2>

                <p>Resultado en un input</p>
                <input type="text" id="resultado11" readonly>
                <p id="resultado22">Resultado con innerText:</p>
                <p id="resultado33">Resultado con innerHTML:</p>
                <p id="resultado44">Resultado con textContent:</p>
            </section>
            <section>
            <form action="">
                <h3>Tercer Ejercicio DOM: operaciones numéricas</h3>

                <label for="valorUno">Valor 1: </label>
                <input type="number" id="valorUno" placeholder="Ej: 15.8">

                <label for="valorDos">Valor 2: </label>
                <input type="number" id="valorDos" placeholder="Ej: 4.25">

                <button type="button" onclick="calcularOperaciones()">Calcular</button>
                <button type="reset">Cancelar</button>

            </form>
            <h2>Resultados: </h2>
            <p id="resultado_suma"></p>
            <p id="resultado_resta"></p>
            <p id="resultado_multiplicacion"></p>
            <p id="resultado_division"></p>
        </section>
    </main>
    
    <script src="js/script.js"></script>


</body>
</html>
